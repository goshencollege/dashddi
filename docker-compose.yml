services:
  app:
    build: .
    read_only: true
    volumes:
      - .:/var/www/html:ro
      - symfony_var:/var/www/html/var
    tmpfs:
      - /tmp
      - /usr/local/var/run
    environment:
      APP_ENV: dev
      APP_SECRET: changeme_in_production_32chars_min
      DATABASE_URL: "mysql://ipam:ipam_password@db:3306/ipam?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    read_only: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  db:
    image: mysql:8.0
    read_only: true
    environment:
      MYSQL_DATABASE: ipam
      MYSQL_USER: ipam
      MYSQL_PASSWORD: ipam_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    tmpfs:
      - /var/run/mysqld
      - /tmp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ipam", "-pipam_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mysql_data:
  symfony_var:
