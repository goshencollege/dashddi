# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.reserved_tag_prefixes:
        - 'snipeit'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DataFixtures/'

    App\Service\ScheduledTaskRunnerService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\RunScheduledTasksCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\SamlImportMetadataCommand:
        arguments:
            $defaultUri: '%env(DEFAULT_URI)%'

    App\Service\EncryptionService:
        arguments:
            $encryptionKey: '%env(APP_ENCRYPTION_KEY)%'

    App\Command\DatabaseBackupCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $encryptionKey: '%env(APP_ENCRYPTION_KEY)%'

    App\Command\DatabaseRestoreCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ReservedTagPrefixService:
        arguments:
            $prefixes: '%app.reserved_tag_prefixes%'

    App\Service\OuiLookupService:
        arguments:
            $databasePath: '%kernel.project_dir%/resources/oui/oui-database.php'

    App\Command\UpdateOuiDatabaseCommand:
        arguments:
            $databasePath: '%kernel.project_dir%/resources/oui/oui-database.php'

    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '%env(resolve:DATABASE_URL)%'
            - { db_table: 'sessions', db_id_col: 'sess_id', db_data_col: 'sess_data', db_time_col: 'sess_time', db_lifetime_col: 'sess_lifetime' }

    # SamlSettings now loads configuration from the saml_provider database table.

when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\DataFixtures\:
            resource: '../src/DataFixtures/'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\DataFixtures\:
            resource: '../src/DataFixtures/'
