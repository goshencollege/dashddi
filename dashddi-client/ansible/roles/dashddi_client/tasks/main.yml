---
# ── Token generation ──────────────────────────────────────────────────────────

- name: Check if credentials file already exists
  ansible.builtin.stat:
    path: "{{ dashddi_credentials_path }}"
  register: _dashddi_credentials_stat

- name: Look up host in DashDDI by name
  ansible.builtin.uri:
    url: "{{ dashddi_url }}/api/hosts?name={{ dashddi_host_name | urlencode }}"
    headers:
      Authorization: "Bearer {{ dashddi_admin_token }}"
  register: _dashddi_host_lookup
  delegate_to: localhost
  when: not _dashddi_credentials_stat.stat.exists or dashddi_force_token_regenerate

- name: Resolve host ID from lookup results
  ansible.builtin.set_fact:
    _dashddi_host_id: >-
      {{ (_dashddi_host_lookup.json
          | selectattr('name', 'equalto', dashddi_host_name)
          | list | first).id }}
  when: not _dashddi_credentials_stat.stat.exists or dashddi_force_token_regenerate

- name: Fail if host not found in DashDDI
  ansible.builtin.fail:
    msg: >
      Host '{{ dashddi_host_name }}' was not found in DashDDI.
      Check that the host is registered and that dashddi_host_name matches exactly.
  when:
    - not _dashddi_credentials_stat.stat.exists or dashddi_force_token_regenerate
    - (_dashddi_host_lookup.json
       | selectattr('name', 'equalto', dashddi_host_name)
       | list | length) == 0

- name: Generate host-scoped token in DashDDI
  ansible.builtin.uri:
    url: "{{ dashddi_url }}/api/hosts/{{ _dashddi_host_id }}/token"
    method: POST
    headers:
      Authorization: "Bearer {{ dashddi_admin_token }}"
    status_code: 201
  register: _dashddi_token_response
  delegate_to: localhost
  no_log: true
  when: not _dashddi_credentials_stat.stat.exists or dashddi_force_token_regenerate

- name: Store generated token
  ansible.builtin.set_fact:
    _dashddi_host_token: "{{ _dashddi_token_response.json.token }}"
  no_log: true
  when: not _dashddi_credentials_stat.stat.exists or dashddi_force_token_regenerate

# ── Install certbot + plugin ──────────────────────────────────────────────────

- name: Install python3-venv
  ansible.builtin.package:
    name: python3-venv
    state: present

- name: Install certbot into virtualenv
  ansible.builtin.pip:
    name: certbot
    virtualenv: "{{ dashddi_venv_path }}"
    virtualenv_command: python3 -m venv

# ── Migrate from certbot-dns-dashddi v2 ───────────────────────────────────────
# A host that had the old, pre-rename certbot-dns-dashddi package installed
# breaks once the new dashddi-client package is added to the same venv — both
# register the same dns-dashddi certbot plugin entry point, and certbot
# refuses to load either ("Duplicate plugin name"). See README.md's
# "Upgrading from certbot-dns-dashddi v2" section.

- name: Uninstall legacy certbot-dns-dashddi package (pre-v3 rename)
  ansible.builtin.pip:
    name: certbot-dns-dashddi
    state: absent
    virtualenv: "{{ dashddi_venv_path }}"

- name: Check for legacy dashddi-certbot systemd timer
  ansible.builtin.stat:
    path: /etc/systemd/system/dashddi-certbot.timer
  register: _dashddi_legacy_timer_stat

- name: Disable legacy dashddi-certbot systemd timer
  ansible.builtin.systemd:
    name: dashddi-certbot.timer
    state: stopped
    enabled: false
  when: _dashddi_legacy_timer_stat.stat.exists

- name: Remove legacy dashddi-certbot systemd units and symlink
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/dashddi-certbot.service
    - /etc/systemd/system/dashddi-certbot.timer
    - /usr/local/bin/dashddi-certbot
  when: _dashddi_legacy_timer_stat.stat.exists

- name: Reload systemd after removing legacy units
  ansible.builtin.systemd:
    daemon_reload: true
  when: _dashddi_legacy_timer_stat.stat.exists

- name: Install dashddi-client plugin
  ansible.builtin.pip:
    name: "{{ dashddi_plugin_source }}"
    virtualenv: "{{ dashddi_venv_path }}"

- name: Symlink certbot to /usr/local/bin
  ansible.builtin.file:
    src: "{{ dashddi_venv_path }}/bin/certbot"
    dest: /usr/local/bin/certbot
    state: link

- name: Symlink dashddi to /usr/local/bin
  ansible.builtin.file:
    src: "{{ dashddi_venv_path }}/bin/dashddi"
    dest: /usr/local/bin/dashddi
    state: link

# ── Credentials file ──────────────────────────────────────────────────────────

- name: Ensure /etc/dashddi exists
  ansible.builtin.file:
    path: /etc/dashddi
    state: directory
    mode: "0755"

- name: Write DashDDI credentials file
  ansible.builtin.template:
    src: dashddi.ini.j2
    dest: "{{ dashddi_credentials_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not _dashddi_credentials_stat.stat.exists or dashddi_force_token_regenerate

# ── Systemd renewal timer ─────────────────────────────────────────────────────

- name: Deploy dashddi.service
  ansible.builtin.template:
    src: dashddi.service.j2
    dest: /etc/systemd/system/dashddi.service
    mode: "0644"

- name: Deploy dashddi.timer
  ansible.builtin.template:
    src: dashddi.timer.j2
    dest: /etc/systemd/system/dashddi.timer
    mode: "0644"

- name: Enable and start renewal timer
  ansible.builtin.systemd:
    name: dashddi.timer
    enabled: true
    state: started
    daemon_reload: true
