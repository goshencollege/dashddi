display_errors = Off
; Must exceed the maximum allowed SAML session lifetime (1440 min = 86400 s).
; App-level expiry is enforced by SessionExpirySubscriber; this just prevents
; PHP's GC from deleting session files before our subscriber has a chance to act.
session.gc_maxlifetime = 86400
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL
memory_limit = 512M
max_execution_time = 30
; Large enough for database backup uploads (Settings → Backup & Restore); must stay
; in step with nginx's client_max_body_size.
upload_max_filesize = 512M
post_max_size = 512M
date.timezone = UTC
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
