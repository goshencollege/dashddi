prefix        = /usr
exec_prefix   = /usr
sysconfdir    = /etc
localstatedir = /var
sbindir       = ${exec_prefix}/sbin
logdir        = /var/log/freeradius
raddbdir      = /etc/freeradius/3.0
radacctdir    = ${logdir}/radacct

name          = freeradius
confdir       = ${raddbdir}
modconfdir    = ${confdir}/mods-config
run_dir       = ${localstatedir}/run/${name}
db_dir        = ${raddbdir}
libdir        = /usr/lib/freeradius
pidfile       = ${run_dir}/${name}.pid

correct_escapes = true

max_request_time = 30
cleanup_delay    = 5
max_requests     = 16384
hostname_lookups = no

log {
    destination    = stdout
    colourise      = yes
    stripped_names = no
    auth           = yes
    auth_badpass   = no
    auth_goodpass  = no
}

checkrad = ${sbindir}/checkrad

security {
    max_attributes = 200
    reject_delay   = 1
    status_server  = yes
}

proxy_requests = no

$INCLUDE clients.conf
$INCLUDE mods-enabled/
$INCLUDE sites-enabled/
